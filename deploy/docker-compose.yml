# ==============================================================================
# Naville SaaS - Orquestração VPS Docker Compose
# Serviços: Evolution API v2, PostgreSQL, Redis, PocketBase, Frontend SPA, Caddy
# ==============================================================================

version: '3.8'

networks:
  naville_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  caddy_data:
    name: naville_caddy_data
  caddy_config:
    name: naville_caddy_config
  pocketbase_data:
    name: naville_pb_data
  evolution_pg_data:
    name: naville_evo_pg_data
  evolution_redis_data:
    name: naville_evo_redis_data
  evolution_instances:
    name: naville_evo_instances
  evolution_store:
    name: naville_evo_store
  waha_sessions:
    name: naville_waha_sessions

services:
  # ============================================================================
  # 1. Caddy Reverse Proxy & SSL Automático & Suporte a WebSockets
  # ============================================================================
  caddy:
    image: caddy:2.8.4-alpine
    container_name: naville_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - naville_network
    depends_on:
      - pocketbase
      - evolution-api
      - frontend-app

  # ============================================================================
  # 2. PocketBase - Banco Relacional + RLS + Hooks de Ciclo de Vida
  # ============================================================================
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: naville_pocketbase
    restart: unless-stopped
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb_data
      - --migrationsDir=/pb_migrations
      - --hooksDir=/pb_hooks
    environment:
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${AUTHENTICATION_API_KEY:-4f89d3a1b72e5c9f0861ab4e3c7d92f15082e6da19743c5b8df2194a860eb3c1}
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb_hooks:ro
    networks:
      - naville_network
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 3. Evolution API v2 - Gateway WhatsApp Oficial Multi-Tenant
  # ============================================================================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: naville_evolution_api
    restart: unless-stopped
    environment:
      - SERVER_URL=http://173.249.51.210/evolution
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY:-4f89d3a1b72e5c9f0861ab4e3c7d92f15082e6da19743c5b8df2194a860eb3c1}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolpass@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_naville
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution_naville
      - CACHE_REDIS_SAVE_INSTANCES=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - naville_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  # ============================================================================
  # 4. PostgreSQL Exclusivo para Evolution API v2
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: naville_evolution_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolpass
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    networks:
      - naville_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 5. Redis Exclusivo para Sessões e Filas da Evolution API
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: naville_evolution_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data
    networks:
      - naville_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 6. Frontend App (Web / PWA) - Servido via Nginx na Porta Interna 3000
  # ============================================================================
  frontend-app:
    image: nginx:alpine
    container_name: naville_frontend_app
    restart: unless-stopped
    volumes:
      - ./frontend/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - naville_network
    expose:
      - "3000"

  # ============================================================================
  # 7. WAHA (WhatsApp HTTP API) - Motor Primário Leve e Estável
  # ============================================================================
  waha:
    image: devlikeapro/waha:latest
    container_name: naville_waha
    restart: unless-stopped
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_LOG_LEVEL=info
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_ZIP_SESSIONS=true
      - WAHA_API_KEY=naville_waha_master_key_2026
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=navilleadmin2026
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - naville_network
    ports:
      - "3018:3000"
    expose:
      - "3000"

